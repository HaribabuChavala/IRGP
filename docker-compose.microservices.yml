services:
  traefik:
    image: traefik:v3.7
    container_name: access-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - access-net

  postgres:
    image: postgres:18
    container_name: access-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres-dev-password
      POSTGRES_DB: report_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d report_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - access-net

  redis:
    image: redis:8
    container_name: access-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - access-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: access-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: change-me-admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-dev-password
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - access-net

  opa:
    image: openpolicyagent/opa:latest
    container_name: access-opa
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy"]
    volumes:
      - ./opa:/policy:ro
    expose:
      - "8181"
    networks:
      - access-net

  vault:
    image: hashicorp/vault:1.20
    container_name: access-vault
    restart: unless-stopped
    command: ["vault", "server", "-dev", "-dev-root-token-id=dev-root-token"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - access-net

  auth-service:
    build:
      context: ./microservices/auth-service
    container_name: access-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://admin:postgres-dev-password@postgres:5432/report_platform
      OPA_URL: http://opa:8181
      KEYCLOAK_ISSUER: http://localhost:8081/realms/report-platform
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/report-platform/protocol/openid-connect/certs
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-service.rule=Host(`auth.localhost`)"
      - "traefik.http.routers.auth-service.entrypoints=web"
      - "traefik.http.services.auth-service.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - redis
      - keycloak
      - opa
    networks:
      - access-net

  user-management-service:
    build:
      context: ./microservices/user-management-service
    container_name: access-user-management-service
    restart: unless-stopped
