name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ github.event.repository.name }}-ai-sql-service:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ github.event.repository.name }}-google-adk-agent:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ github.event.repository.name }}-report-generation-service:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ github.event.repository.name }}-user-management-service:latest

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Helm lint chart
        run: |
          helm lint separated-projects/helm/report-platform

      - name: Package chart
        run: |
          helm package separated-projects/helm/report-platform -d ./charts-packages

  publish-images:
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-ai-sql-service:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-google-adk-agent:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-report-generation-service:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-user-management-service:latest
