name: production-gate

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  template-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate production template policy
        run: python scripts/validate-production-template.py .env.production.example

  ui-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  backend-compile-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile API sources
        run: python -m compileall api

      - name: Install AI SQL service test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r IRGP/ai-sql-service/requirements.txt

      - name: Run AI SQL service tests
        run: pytest IRGP/ai-sql-service/tests -q

