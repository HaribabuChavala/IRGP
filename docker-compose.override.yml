services:

  audit-service:
    build: ./microservices/audit-service
    container_name: access-audit-service
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./audit_service.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audit-service.rule=Host(`audit.localhost`)"
      - "traefik.http.routers.audit-service.entrypoints=web"
      - "traefik.http.services.audit-service.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - keycloak
    networks:
      - access-net

