services:

  audit-service:
    build: ./IRGP/audit-service
    container_name: access-audit-service
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./audit_service.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audit-service.rule=Host(`audit.localhost`)"
      - "traefik.http.routers.audit-service.entrypoints=web"
      - "traefik.http.services.audit-service.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - keycloak
    networks:
      - access-net

  scheduler-service:
    build: ./IRGP/scheduler-service
    container_name: access-scheduler-service
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./scheduler_service.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scheduler-service.rule=Host(`scheduler.localhost`)"
      - "traefik.http.routers.scheduler-service.entrypoints=web"
      - "traefik.http.services.scheduler-service.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - keycloak
    networks:
      - access-net

  observability-service:
    build: ./IRGP/observability-service
    container_name: access-observability-service
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./observability_service.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.observability-service.rule=Host(`observability.localhost`)"
      - "traefik.http.routers.observability-service.entrypoints=web"
      - "traefik.http.services.observability-service.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - keycloak
    networks:
      - access-net

  export-service:
    build: ./IRGP/export-service
    container_name: access-export-service
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./export_service.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.export-service.rule=Host(`export.localhost`)"
      - "traefik.http.routers.export-service.entrypoints=web"
      - "traefik.http.services.export-service.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - keycloak
    networks:
      - access-net

  billing-service:
    build: ./IRGP/billing-service
    container_name: access-billing-service
    restart: unless-stopped
    environment:
      PORT: "8000"
      BILLING_SERVICE_ENV: local
      DATABASE_URL: postgres://admin:postgres-dev-password@postgres:5432/report_platform?sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.billing-service.rule=Host(`billing.localhost`)"
      - "traefik.http.routers.billing-service.entrypoints=web"
      - "traefik.http.services.billing-service.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - keycloak
    networks:
      - access-net

  payment-service:
    build: ./IRGP/payment-service
    container_name: access-payment-service
    restart: unless-stopped
    environment:
      PORT: "8000"
      STRIPE_API_KEY: ${STRIPE_API_KEY:-dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-dummy}
      BILLING_SERVICE_URL: http://billing-service:8000
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payment-service.rule=Host(`payment.localhost`)"
      - "traefik.http.routers.payment-service.entrypoints=web"
      - "traefik.http.services.payment-service.loadbalancer.server.port=8000"
    depends_on:
      - billing-service
      - postgres
      - keycloak
    networks:
      - access-net

