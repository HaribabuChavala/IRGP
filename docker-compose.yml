services:

  # =========================================================
  # TRAEFIK
  # =========================================================

  traefik:
    image: traefik:v3.7
    container_name: access-traefik
    restart: unless-stopped

    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"

    ports:
      - "80:80"
      - "8088:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - access-net


  # =========================================================
  # KEYCLOAK
  # =========================================================

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: access-keycloak
    restart: unless-stopped

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-admin}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev-password}

    ports:
      - "8081:8080"

    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - access-net

  keycloak-sync:
    image: python:3.12-slim
    container_name: access-keycloak-sync
    restart: "no"
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: report-platform
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-admin}
    volumes:
      - ./keycloak:/app:ro
    command: sh -c "pip install --no-cache-dir requests >/dev/null 2>&1 && python /app/sync_user_claims.py"
    networks:
      - access-net


  # =========================================================
  # POSTGRES
  # =========================================================

  postgres:
    image: postgres:18
    container_name: access-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-report_platform}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-report_platform}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - access-net


  # =========================================================
  # ORACLE (LOCAL TEST DB)
  # =========================================================

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: access-oracle
    restart: unless-stopped

    environment:
      ORACLE_PASSWORD: oracle-admin-password

    ports:
      - "1521:1521"

    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro

    networks:
      - access-net


  # =========================================================
  # TERADATA LAB (POSTGRES-BACKED TEST DB)
  # =========================================================

  teradata-lab:
    image: postgres:18
    container_name: access-teradata-lab
    restart: unless-stopped

    environment:
      POSTGRES_USER: td_admin
      POSTGRES_PASSWORD: td-admin-password
      POSTGRES_DB: teradata_lab

    ports:
      - "1025:5432"

    volumes:
      - teradata-lab-data:/var/lib/postgresql
      - ./teradata-lab/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U td_admin -d teradata_lab"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - access-net


  # =========================================================
  # OPA
  # =========================================================

  opa:
    image: openpolicyagent/opa:latest
    container_name: access-opa
    restart: unless-stopped

    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policy

    volumes:
      - ./opa:/policy:ro

    expose:
      - "8181"

    networks:
      - access-net


  # =========================================================
  # REDIS
  # =========================================================

  redis:
    image: redis:8
    container_name: access-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    ports:
      - "6379:6379"

    networks:
      - access-net


  # =========================================================
  # HASHICORP VAULT
  # =========================================================

  vault:
    image: hashicorp/vault:1.20
    container_name: access-vault
    restart: unless-stopped

    command:
      - vault
      - server
      - -dev
      - -dev-root-token-id=${VAULT_ROOT_TOKEN:-dev-root-token}

    cap_add:
      - IPC_LOCK

    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    ports:
      - "8200:8200"

    volumes:
      - vault-data:/vault/file

    networks:
      - access-net


  # =========================================================
  # GOOGLE ADK AGENT (LOCAL MOCK)
  # =========================================================

  google-adk-agent:
    build: ./IRGP/irgp-google-adk-agent
    container_name: access-google-adk-agent
    restart: unless-stopped

    environment:
      EXPECTED_API_TOKEN: ${GOOGLE_ADK_AGENT_API_KEY:-local-adk-test-key}

    expose:
      - "8001"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.google-adk-agent.rule=Host(`adk.localhost`)"
      - "traefik.http.routers.google-adk-agent.entrypoints=web"
      - "traefik.http.services.google-adk-agent.loadbalancer.server.port=8001"

    networks:
      - access-net


  # =========================================================
  # LIVY SERVICE
  # =========================================================

  spark-livy:
    build:
      context: ./IRGP
      dockerfile: irgp-spark-livy/Dockerfile
    container_name: access-spark-livy
    restart: unless-stopped

    environment:
      SPARK_LOCAL_IP: 0.0.0.0
      LIVY_SERVER_HOST: 0.0.0.0
      LIVY_LOG_DIR: /tmp/livy
      LIVY_STATE_DIR: /tmp/livy-state
      LIVY_ORACLE_JAR: /opt/irgp/jars/oracle-connector-1.0.0.jar
      LIVY_HIVE_JAR: /opt/irgp/jars/hive-connector-1.0.0.jar

    ports:
      - "8998:8998"

    volumes:
      - spark-jars:/opt/irgp/jars

    networks:
      - access-net


  livy-service:
    build: ./IRGP/irgp-livy-service
    container_name: access-livy-service
    restart: unless-stopped

    environment:
      SERVER_PORT: 8090
      LIVY_BASE_URL: ${LIVY_BASE_URL:-http://spark-livy:8998}
      LIVY_ORACLE_JAR: ${LIVY_ORACLE_JAR:-/opt/irgp/jars/oracle-connector-1.0.0.jar}
      LIVY_HIVE_JAR: ${LIVY_HIVE_JAR:-/opt/irgp/jars/hive-connector-1.0.0.jar}

    expose:
      - "8090"

    depends_on:
      - spark-livy

    networks:
      - access-net


  # =========================================================
  # AI SQL SERVICE
  # =========================================================

  ai-sql-service:
    build: ./IRGP/irgp-ai-sql-service
    container_name: access-ai-sql-service
    restart: unless-stopped

    environment:
      GOOGLE_ADK_AGENT_URL: ${GOOGLE_ADK_AGENT_URL:-http://google-adk-agent:8001/agent}
      GOOGLE_ADK_AGENT_API_KEY: ${GOOGLE_ADK_AGENT_API_KEY:-local-adk-test-key}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
      VAULT_SECRET_PATH: ${VAULT_SECRET_PATH:-secret/data/report-platform}
      VAULT_GOOGLE_ADK_API_KEY_FIELD: ${VAULT_GOOGLE_ADK_API_KEY_FIELD:-GOOGLE_ADK_AGENT_API_KEY}
      GOOGLE_GEMINI_MODEL: ${GOOGLE_GEMINI_MODEL:-gemini-2.5-flash}
      MAX_SQL_LIMIT: ${MAX_SQL_LIMIT:-1000}
      DENY_STAR_SELECT: ${DENY_STAR_SELECT:-true}
      ENFORCE_ROW_LIMIT: ${ENFORCE_ROW_LIMIT:-true}
      REQUIRE_TENANT_ALLOWLIST: ${REQUIRE_TENANT_ALLOWLIST:-true}
      TENANT_TABLE_ALLOWLIST_JSON: ${TENANT_TABLE_ALLOWLIST_JSON:-{"org-acme":["testing.sales_orders","testing.sales_order_items","testing.customers","testing.products","report_platform.sales_orders","report_platform.sales_order_items","report_platform.customers","report_platform.products"],"org-spartexai":["testing.sales_orders","testing.sales_order_items","testing.customers","testing.products","report_platform.sales_orders","report_platform.sales_order_items","report_platform.customers","report_platform.products"],"org-hsbc":["testing.sales_orders","testing.sales_order_items","testing.customers","testing.products","report_platform.sales_orders","report_platform.sales_order_items","report_platform.customers","report_platform.products"],"org-startup":["testing.sales_orders","testing.sales_order_items","testing.customers","testing.products","report_platform.sales_orders","report_platform.sales_order_items","report_platform.customers","report_platform.products"],"tenant-acme":["testing.sales_orders","testing.sales_order_items","testing.customers","testing.products","report_platform.sales_orders","report_platform.sales_order_items","report_platform.customers","report_platform.products"],"tenant-demo":["testing.sales_orders","testing.sales_order_items","testing.customers","testing.products","report_platform.sales_orders","report_platform.sales_order_items","report_platform.customers","report_platform.products"]}}

    expose:
      - "8000"

    depends_on:
      - google-adk-agent

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-sql-service.rule=Host(`aisql.localhost`)"
      - "traefik.http.routers.ai-sql-service.entrypoints=web"
      - "traefik.http.services.ai-sql-service.loadbalancer.server.port=8000"

    networks:
      - access-net


  # =========================================================
  # FASTAPI
  # =========================================================

  api:
    build: ./api
    container_name: access-api
    restart: unless-stopped

    environment:

      # OPA
      OPA_URL: http://opa:8181

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Keycloak
      KEYCLOAK_ISSUER: http://localhost:8081/realms/report-platform
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/report-platform/protocol/openid-connect/certs

      # Vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
      VAULT_SECRET_PATH: secret/data/report-platform

      # Data source connection test controls
      DB_TEST_CONNECT_TIMEOUT_SECONDS: 5
      HIVE_AUTH_MECHANISM: NOSASL
      TERADATA_LOGMECH: TD2
      TERADATA_ENCRYPT_DATA: "true"
      TERADATA_TEST_BACKEND: ${TERADATA_TEST_BACKEND:-postgres}

      # Postgres application DB
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-postgres-dev-password}@postgres:5432/${POSTGRES_DB:-report_platform}

      # AI SQL generation microservice
      AI_SQL_SERVICE_URL: http://ai-sql-service:8000/generate-sql
      # AI HTTP timeout (seconds)
      AI_SQL_TIMEOUT: ${AI_SQL_TIMEOUT:-30}
      LIVY_SERVICE_URL: http://livy-service:8090/api/livy

      # Email provider for temp-password invitations
      # Set EMAIL_PROVIDER to "smtp" or "sendgrid" and provide the matching secrets.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@report.localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}

    expose:
      - "8000"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.report-api.rule=Host(`report.localhost`)"
      - "traefik.http.routers.report-api.entrypoints=web"
      - "traefik.http.services.report-api.loadbalancer.server.port=8000"

    depends_on:
      - opa
      - redis
      - postgres
      - oracle
      - teradata-lab
      - vault
      - keycloak
      - ai-sql-service
      - livy-service

    networks:
      - access-net


  # =========================================================
  # NEXT.JS UI
  # =========================================================

  ui:
    build: ./IRGP/irgp-ui
    container_name: access-ui
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_BASE_URL: http://report.localhost
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8081
      NEXT_PUBLIC_KEYCLOAK_REALM: report-platform
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: report-platform-ui

    ports:
      - "3000:3000"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.report-ui.rule=Host(`app.localhost`)"
      - "traefik.http.routers.report-ui.entrypoints=web"
      - "traefik.http.services.report-ui.loadbalancer.server.port=3000"

    depends_on:
      - api

    networks:
      - access-net


# =========================================================
# NETWORK
# =========================================================

networks:

  access-net:
    name: access-security-net


# =========================================================
# VOLUMES
# =========================================================

volumes:

  postgres-data:
  oracle-data:
  teradata-lab-data:
  redis-data:
  vault-data:
  spark-jars: