{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "report-platform.fullname" $root }}-{{ $name }}-config
  labels:
{{ include "report-platform.labels" $root | trim | indent 4 }}
    component: {{ $name }}
data:
  {{- range $k, $v := $svc.config.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
{{- end }}
{{- end }}
