apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-platform-ai-sql-service
  labels:
    app.kubernetes.io/name: report-platform-ai-sql-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-platform-ai-sql-service
  template:
    metadata:
      labels:
        app: report-platform-ai-sql-service
    spec:
      containers:
        - name: ai-sql-service
          image: "your-registry/IRGP-ai-sql-service:latest"
          ports:
            - containerPort: 8000
          envFrom:
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
