replicaCount: 2
imagePullPolicy: IfNotPresent

services:
  ai-sql-service:
    image: "your-registry/IRGP-ai-sql-service:latest"
    port: 8000
    replicas: 2
    env: {}
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "200m"
        memory: "256Mi"
    config:
      enabled: true
      data:
        APP_SETTING: "demo"
    secrets:
      enabled: true
      data:
        API_KEY: "super-secret-value"
    probes:
      enabled: true
      livenessPath: /health
      readinessPath: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      readinessInitialDelaySeconds: 5
      readinessPeriodSeconds: 10
  google-adk-agent:
    image: "your-registry/IRGP-google-adk-agent:latest"
    port: 8001
    replicas: 1
    env:
      EXPECTED_API_TOKEN: "local-adk-test-key"
    resources:
      limits:
        cpu: "250m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    config:
      enabled: true
      data:
        ADK_MODE: "test"
    secrets:
      enabled: true
      data:
        ADK_TOKEN: "adk-secret"
    probes:
      enabled: true
      livenessPath: /health
      readinessPath: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      readinessInitialDelaySeconds: 5
      readinessPeriodSeconds: 10
  report-generation-service:
    image: "your-registry/IRGP-report-generation-service:latest"
    port: 8000
    replicas: 2
    env: {}
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "200m"
        memory: "256Mi"
    config:
      enabled: true
      data:
        REPORT_MODE: "sample"
    secrets:
      enabled: true
      data:
        REPORT_SIGNING_KEY: "report-secret"
    probes:
      enabled: true
      livenessPath: /health
      readinessPath: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      readinessInitialDelaySeconds: 5
      readinessPeriodSeconds: 10
  user-management-service:
    image: "your-registry/IRGP-user-management-service:latest"
    port: 8000
    replicas: 1
    env: {}
    resources:
      limits:
        cpu: "300m"
        memory: "256Mi"
      requests:
        cpu: "150m"
        memory: "128Mi"
    config:
      enabled: true
      data:
        USER_DB: "users-db"
    secrets:
      enabled: true
      data:
        DB_PASSWORD: "user-db-pass"
    probes:
      enabled: true
      livenessPath: /health
      readinessPath: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      readinessInitialDelaySeconds: 5
      readinessPeriodSeconds: 10

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: report.local
      paths:
        - path: /
          pathType: Prefix

serviceAccount:
  create: false

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

namespace: report-platform

