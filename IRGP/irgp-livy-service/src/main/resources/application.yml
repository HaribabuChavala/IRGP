server:
  port: 8090

livy:
  base-url: ${LIVY_BASE_URL:http://localhost:8998}
  connect-timeout-ms: 5000
  read-timeout-ms: 30000
  oracle-connector-jar: ${LIVY_ORACLE_JAR:/opt/irgp/jars/oracle-connector-1.0.0.jar}
  hive-connector-jar: ${LIVY_HIVE_JAR:/opt/irgp/jars/hive-connector-1.0.0.jar}

logging:
  level:
    com.irgp.livy: INFO
    org.springframework.web: INFO
